# /etc/nginx/sites-available/dash.treelogy-services.my.id
#
# Terminates TLS for the A/B dashboard and forwards to its live blue/green
# slot (127.0.0.1:3310 or :3311). Self-contained like the ab.* vhost.
#
# `upstream treelogy_ab_dash` lives in /etc/nginx/conf.d/treelogy-ab-dash-upstream.conf,
# which the deploy script rewrites to point at the live slot.

# Login posts are Server Actions to /login. The password check is scrypt and
# deliberately expensive, so brute force costs CPU on a shared box: limit POSTs
# per client IP. GETs get an empty key, which nginx does not count.
map $request_method $treelogy_ab_dash_login_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $treelogy_ab_dash_login_key zone=treelogy_ab_dash_login:1m rate=10r/m;

server {
    listen 80;
    server_name dash.treelogy-services.my.id;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name dash.treelogy-services.my.id;

    ssl_certificate     /etc/letsencrypt/live/dash.treelogy-services.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dash.treelogy-services.my.id/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # The dashboard frames its own snapshot routes, so SAMEORIGIN, not DENY.
    # Those routes send the same value; hide it so the header is not doubled.
    proxy_hide_header X-Frame-Options;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    # Empty — so not sent — except to loopback clients (the deploy's edge check).
    add_header X-Upstream                $treelogy_ab_dash_slot always;

    access_log /var/log/nginx/treelogy-ab-dash.access.log;
    error_log  /var/log/nginx/treelogy-ab-dash.error.log warn;

    client_max_body_size 2m;
    # Bridge actions (theme preparation, PostHog sync) can take a while.
    proxy_read_timeout   120s;
    proxy_send_timeout   60s;

    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Connection        "";

    # The probe touches the database; keep it off the public internet.
    location = /api/healthz { return 404; }

    location = /login {
        limit_req        zone=treelogy_ab_dash_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass       http://treelogy_ab_dash;
    }

    location / {
        proxy_pass http://treelogy_ab_dash;
    }
}
